<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mina's Workouts">
<meta name="theme-color" content="#fff7f1">
<title>Mina's Workouts</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23e8664a'/%3E%3Ctext x='90' y='118' font-size='90' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EM%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23e8664a'/%3E%3Ctext x='90' y='118' font-size='90' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EM%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#fff7f1; --card:#ffffff; --ink:#2b1d18; --muted:#8a7068; --line:#f1e2d9;
  --accent:#e8664a; --accent2:#f29a5c; --accent-soft:#fde6dc; --good:#3fa66b; --good-soft:#e2f4e8;
  --radius:22px; --shadow:0 6px 20px rgba(120,60,30,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 24px)}
h1{font-size:30px;line-height:1.1;margin:6px 0 4px;letter-spacing:-.5px}
h2{font-size:22px;margin:0;letter-spacing:-.3px}
.sub{color:var(--muted);font-size:15px;margin:0}
.tip{display:flex;gap:8px;align-items:center;background:var(--accent-soft);color:#a8432b;border-radius:14px;padding:10px 14px;font-size:14px;font-weight:600;margin:14px 0}
.cards{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.daycard{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border:2px solid transparent;transition:transform .1s}
.daycard:active{transform:scale(.98)}
.daycard.today{border-color:var(--accent);background:linear-gradient(135deg,#fff 0%,#fff1ea 100%)}
.dayicon{flex:0 0 56px;height:56px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.daycard.done .dayicon{background:var(--good)}
.daymeta{flex:1;min-width:0}
.dayname{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;display:flex;gap:8px;align-items:center}
.daytitle{font-size:19px;font-weight:700;margin-top:2px}
.daytime{font-size:14px;color:var(--muted);margin-top:2px}
.badge{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--accent);color:#fff;letter-spacing:.4px}
.badge.good{background:var(--good)}
.chev{color:#cdb5ab;font-size:26px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;min-height:44px}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:20px}
.hero{border-radius:var(--radius);padding:22px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:var(--shadow);margin-bottom:14px}
.hero .k{opacity:.9;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.hero h1{color:#fff}
.hero .pills{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.22);padding:6px 11px;border-radius:99px;font-size:13px;font-weight:600}
.section{background:var(--card);border-radius:var(--radius);padding:16px 16px 6px;box-shadow:var(--shadow);margin-bottom:12px}
.section .h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.section .h b{font-size:16px}
.section .h span{font-size:13px;color:var(--muted);font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.thumb{flex:0 0 64px;height:42px;border-radius:10px;background:#f6ece6 center/cover no-repeat;display:grid;place-items:center;font-size:20px}
.row .n{font-weight:600;font-size:15px}
.row .d{font-size:13px;color:var(--muted)}
.ss{display:inline-block;font-size:10px;font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 6px;margin-right:6px;vertical-align:1px}
.cta{display:block;width:100%;padding:18px;border-radius:18px;background:var(--accent);color:#fff;font-size:18px;font-weight:700;box-shadow:0 8px 20px rgba(232,102,74,.35);text-align:center}
.cta:active{transform:scale(.98)}
.cta.ghost{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.sticky{position:sticky;bottom:calc(env(safe-area-inset-bottom) + 12px);margin-top:16px}
/* goals */
.goals{background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);margin-bottom:12px}
.goals .h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.goals .h b{font-size:15px}.goals .h span{font-size:12px;color:var(--muted);font-weight:600}
.goal{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 0;font-size:14px;line-height:1.3}
.goal .box{flex:0 0 26px;height:26px;border-radius:8px;border:2px solid #e3cfc5;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:800;transition:all .15s}
.goal.on .box{background:var(--good);border-color:var(--good)}
.goal.on .gt{color:var(--muted);text-decoration:line-through}
.meal{display:block;font-size:11px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.6px;margin-bottom:1px}
.goal.on .meal{color:var(--muted)}
.foodnote{font-size:13px;color:var(--ink);background:var(--bg);border-radius:12px;padding:9px 12px;margin-top:8px}
.foodnote.small{font-size:12px;color:var(--muted)}
/* workout */
.progress{height:8px;background:#f3e3da;border-radius:99px;overflow:hidden;flex:1;margin:0 12px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .3s}
.stepcount{font-size:13px;color:var(--muted);font-weight:700;min-width:44px;text-align:right}
.exlabel{font-size:13px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.6px;margin:12px 0 4px}
.pic{width:100%;aspect-ratio:16/9;border-radius:var(--radius);background:#f6ece6 center/cover no-repeat;box-shadow:var(--shadow);margin:8px 0 14px;overflow:hidden}
.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:linear-gradient(135deg,#fde6dc,#fff1e6);color:#c2583f}
.ph .e{font-size:54px;line-height:1}
.ph .t{font-size:13px;font-weight:700;opacity:.8}
.exname{font-size:28px;font-weight:800;letter-spacing:-.5px;margin:0}
.sr{display:flex;gap:10px;margin:12px 0}
.stat{flex:1;background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.stat .v{font-size:22px;font-weight:800}
.stat .l{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.explain{font-size:15px;color:var(--muted);margin:0 0 12px}
.note{font-size:14px;background:#fff;border-left:4px solid var(--accent2);border-radius:10px;padding:10px 12px;margin:0 0 12px;box-shadow:var(--shadow)}
.vid{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:16px;background:#2b1d18;color:#fff;font-weight:700;font-size:16px;text-decoration:none;margin-bottom:14px}
.sets{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.sets .h{font-size:14px;font-weight:700;color:var(--muted);margin-bottom:12px}
.dots{display:flex;gap:12px;flex-wrap:wrap}
.dot{width:58px;height:58px;border-radius:50%;border:3px solid #ecd6cb;display:grid;place-items:center;font-weight:800;font-size:18px;color:var(--muted);background:#fff;transition:all .15s}
.dot.on{background:var(--good);border-color:var(--good);color:#fff}
.holdbtn{width:100%;padding:14px;border-radius:16px;background:var(--accent-soft);color:#a8432b;font-weight:800;font-size:17px;margin-top:14px}
.holdbtn.run{background:var(--accent);color:#fff}
.nav{display:flex;gap:10px;margin-top:16px;position:sticky;bottom:calc(env(safe-area-inset-bottom) + 10px)}
.nav button{flex:1;padding:17px;border-radius:18px;font-weight:700;font-size:17px}
.nav .back{flex:0 0 32%;background:var(--card);box-shadow:var(--shadow)}
.nav .next{background:var(--accent);color:#fff;box-shadow:0 8px 20px rgba(232,102,74,.35)}
.nav .next.ready{background:var(--good);box-shadow:0 8px 20px rgba(63,166,107,.35)}
/* rest sheet */
.sheet{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 86px);z-index:20;transform:translateY(calc(100% + 120px));opacity:0;transition:transform .28s ease,opacity .2s;padding:0 12px;pointer-events:none}
.sheet.show{transform:none;opacity:1;pointer-events:auto}
.sheet .in{max-width:500px;margin:0 auto;background:#2b1d18;color:#fff;border-radius:24px;padding:16px 18px;box-shadow:0 -6px 30px rgba(0,0,0,.25);text-align:center}
.sheet .l{font-size:13px;font-weight:700;opacity:.7;text-transform:uppercase;letter-spacing:.8px}
.sheet .t{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px;margin:4px 0}
.sheet .bar{height:6px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden;margin-bottom:14px}
.sheet .bar i{display:block;height:100%;background:var(--accent2)}
.sheet .btns{display:flex;gap:10px}
.sheet .btns button{flex:1;padding:14px;border-radius:14px;background:rgba(255,255,255,.12);font-weight:700;font-size:16px;color:#fff}
.sheet .btns .skip{background:var(--accent)}
/* finish */
.finish{text-align:center;padding-top:30px}
.trophy{font-size:84px;animation:pop .6s ease}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.weekstrip{display:flex;gap:6px;justify-content:center;margin:18px 0}
.weekstrip span{width:44px;height:44px;border-radius:12px;background:#f3e3da;display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--muted)}
.weekstrip span.on{background:var(--good);color:#fff}
.footer{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
/* swap */
.exhead{display:flex;align-items:center;gap:10px}
.exhead .exname{flex:1;min-width:0}
.swapbtn{flex:0 0 auto;padding:10px 14px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-weight:800;font-size:15px;color:var(--accent);min-height:44px}
.swapmini{flex:0 0 44px;height:44px;border-radius:14px;background:var(--bg);color:var(--accent);font-size:20px;font-weight:800;display:grid;place-items:center}
.swapped{font-size:12px;font-weight:700;color:#a8432b;background:var(--accent-soft);display:inline-block;border-radius:8px;padding:2px 8px;margin-top:3px}
.swopt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--shadow);border:2px solid transparent;margin-bottom:10px}
.swopt.cur{border-color:var(--good);cursor:default}
.swopt:not(.cur):active{transform:scale(.98)}
.swopt .thumb{flex:0 0 72px;height:54px}
.swopt .sm{flex:1;min-width:0}
.swopt .sn{font-weight:800;font-size:16px}
.swopt .sc{font-size:13px;color:var(--muted);line-height:1.35;margin-top:2px}
.swopt .sv{display:inline-block;margin-top:6px;font-size:13px;font-weight:700;color:#fff;background:#2b1d18;border-radius:10px;padding:5px 10px;text-decoration:none}
.swopt .tag{font-size:10px;font-weight:800;color:#fff;background:var(--good);border-radius:99px;padding:2px 7px;margin-left:6px;vertical-align:2px}
.swback{display:block;width:100%;padding:14px;border-radius:16px;background:var(--accent-soft);color:#a8432b;font-weight:800;font-size:16px;margin-bottom:12px}
/* lift weight */
.wcard{background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);margin-bottom:12px}
.wcard .h{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:700;color:var(--muted);margin-bottom:10px}
.wcard .h .ok{color:var(--good);font-size:13px}
.wrow{display:flex;gap:10px;align-items:stretch}
.wbtn{flex:0 0 68px;border-radius:16px;background:var(--accent-soft);color:#a8432b;font-weight:800;font-size:18px;min-height:56px}
.wbtn:active{transform:scale(.95)}
.win{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--line);border-radius:16px;background:#fff;padding:0 10px}
.win:focus-within{border-color:var(--accent2)}
.win input{width:100%;max-width:110px;border:0;outline:none;background:transparent;font:inherit;font-size:28px;font-weight:800;text-align:right;color:var(--ink);padding:8px 0;-webkit-appearance:none;appearance:none}
.win span{font-size:16px;font-weight:700;color:var(--muted)}
.wlast{font-size:14px;color:var(--muted);margin-top:10px;font-weight:600}
.wlast b{color:var(--ink)}
/* body weight */
.bodyw{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);margin:0 0 12px}
.bodyw:active{transform:scale(.98)}
.bodyw .bm{flex:1;min-width:0}
.bodyw .bl{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.bodyw .bv{font-size:24px;font-weight:800;margin-top:2px}
.bodyw .bv small{font-size:15px;color:var(--muted);font-weight:700}
.bodyw .bd{font-size:13px;color:var(--muted);font-weight:600}
.bodyw svg{flex:0 0 96px;height:44px}
.bodyw .blog{flex:0 0 auto;font-size:14px;font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:12px;padding:9px 11px}
.chart{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:12px;margin-bottom:12px}
.chart svg{display:block;width:100%;height:150px}
.bwrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.bwrow:first-child{border-top:0}
.bwrow .bwd{flex:1;color:var(--muted);font-weight:600}
.bwrow .bww{font-weight:800}
.bwrow .bwc{flex:0 0 64px;text-align:right;font-size:13px;color:var(--muted);font-weight:700}
/* meal times */
.goal.next{background:var(--accent-soft);border-radius:14px;margin:2px -8px;padding:9px 8px;width:calc(100% + 16px)}
.goal.next .box{border-color:var(--accent);background:#fff}
.upnext{display:inline-block;font-size:10px;font-weight:800;color:#fff;background:var(--accent);border-radius:99px;padding:2px 7px;margin-left:4px;letter-spacing:.4px;vertical-align:1px}
.mnote{display:block;font-size:12px;color:var(--muted);margin-top:3px;font-style:italic}
.goal.on .mnote{text-decoration:none}
.loglink{display:flex;justify-content:space-between;align-items:center;width:100%;margin:10px 0 2px;padding:13px 14px;border-radius:14px;background:var(--good-soft);color:#24774a;font-weight:700;font-size:15px}
.loglink span{font-size:22px;line-height:1}
/* track food card (home) */
.track{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);border:2px solid #cfead9;margin:0 0 12px;transition:transform .1s}
.track:active{transform:scale(.98)}
.trackic{flex:0 0 52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;background:var(--good-soft)}
.trackm{flex:1;min-width:0}
.trackt{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.trackv{font-size:15px;margin:3px 0 8px;color:var(--muted)}
.trackv b{font-size:19px;color:var(--ink)}
.pbar{height:10px;background:#f3e3da;border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .3s}
.pbar.full i{background:var(--good)}
/* food log */
.ftitle{font-size:19px;font-weight:800}
.fsum{border-radius:var(--radius);padding:20px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:var(--shadow);margin-bottom:12px}
.fsum .k{opacity:.9;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.fsum .big{font-size:20px;font-weight:600;margin-top:4px}
.fsum .big b{font-size:44px;font-weight:800;letter-spacing:-1px}
.fsum .pbar{height:12px;background:rgba(255,255,255,.3);margin:10px 0 10px}
.fsum .pbar i{background:#fff}
.fsum .fsub{font-size:15px;font-weight:600;opacity:.95}
.btns2{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:12px}
.cta.small{padding:15px;font-size:16px}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 0 14px}
.qbtn{position:relative;background:var(--bg);border-radius:16px;padding:12px;text-align:left;min-height:84px;display:flex;flex-direction:column;justify-content:flex-start;gap:2px;border:2px solid transparent;transition:transform .1s}
.qbtn:active{transform:scale(.96);border-color:var(--accent2)}
.qbtn .qi{font-size:22px;line-height:1.1}
.qbtn .qn{font-weight:700;font-size:14px;line-height:1.25;word-break:break-word}
.qbtn .qd{font-size:12px;color:var(--muted);font-weight:700}
.qbtn .qx{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:#d9534f;color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800}
.linkbtn{font-size:14px;font-weight:700;color:var(--accent);padding:6px 4px}
.ent{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ent:first-of-type{border-top:0}
.ent .et{flex:0 0 62px;font-size:13px;color:var(--muted);font-weight:700}
.ent .em{flex:1;min-width:0}
.ent .en{font-weight:600;font-size:15px;line-height:1.25;word-break:break-word}
.ent .ed{font-size:13px;color:var(--muted)}
.ent .ed b{color:var(--accent)}
.del{flex:0 0 44px;height:44px;border-radius:14px;background:var(--bg);color:#b04a3a;font-size:18px;font-weight:800;display:grid;place-items:center}
.empty{font-size:14px;color:var(--muted);padding:6px 0 14px}
.ftot{display:flex;justify-content:space-between;font-weight:800;font-size:15px;padding:12px 0;border-top:2px solid var(--line)}
.hist{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px}
.hist .hd{flex:0 0 66px;font-weight:700;color:var(--muted)}
.hist .hd.today{color:var(--accent)}
.hist .pbar{flex:1;height:12px}
.hist .hv{flex:0 0 58px;text-align:right;font-weight:800}
.field{display:block;margin:0 0 12px}
.field span{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:5px}
.field input{width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);background:#fff;font:inherit;font-size:17px;color:var(--ink);-webkit-appearance:none;appearance:none}
.field input:focus{outline:none;border-color:var(--accent2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.saved{color:var(--good);font-weight:700;font-size:14px;margin-left:8px}
/* modal */
body.noscroll{overflow:hidden}
.modal{position:fixed;inset:0;z-index:30;background:rgba(43,29,24,.5);display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.mbox{width:100%;max-width:520px;background:var(--bg);border-radius:26px 26px 0 0;padding:16px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:94vh;overflow:auto;-webkit-overflow-scrolling:touch;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mh b{font-size:20px}
.mx{width:44px;height:44px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:18px;display:grid;place-items:center}
.cam{position:relative;border-radius:20px;overflow:hidden;background:#1d1411;aspect-ratio:4/5;max-height:56vh;width:100%;margin-bottom:12px}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame{position:absolute;left:8%;right:8%;top:36%;height:28%;border:3px solid rgba(255,255,255,.95);border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.laser{position:absolute;left:5%;right:5%;top:50%;height:2px;background:var(--accent2);box-shadow:0 0 10px var(--accent2);animation:scanln 1.4s ease-in-out infinite alternate}
@keyframes scanln{from{top:15%}to{top:85%}}
.camstat{font-size:15px;text-align:center;color:var(--ink);margin:0 0 12px;line-height:1.4}
.camerr{background:var(--card);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:12px;font-size:15px;line-height:1.45}
.camerr .ce{font-size:40px;text-align:center}
.camerr .cet{font-size:17px;font-weight:800;margin:6px 0 6px;text-align:center}
.mstack{display:flex;flex-direction:column;gap:10px}
.prod{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.prod .pn{font-size:20px;font-weight:800;line-height:1.2}
.prod .pb{font-size:14px;color:var(--muted);font-weight:600;margin-top:3px}
.prod .ps{font-size:14px;margin-top:8px;background:var(--bg);border-radius:10px;padding:7px 10px;display:inline-block}
.nut{display:flex;gap:10px;margin-top:12px}
.nut div{flex:1;background:var(--accent-soft);border-radius:14px;padding:10px 12px}
.nut b{display:block;font-size:24px;font-weight:800;color:#a8432b}
.nut span{font-size:12px;font-weight:700;color:#a8432b;opacity:.85}
.lbl{font-size:14px;font-weight:700;color:var(--muted);margin:4px 0 8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{flex:1;min-width:58px;padding:14px 8px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-weight:800;font-size:17px;border:2px solid transparent}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:#a8432b}
.tot{text-align:center;font-size:15px;margin:2px 0 12px;color:var(--muted)}
.tot b{color:var(--ink);font-size:17px}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--accent-soft);border-top-color:var(--accent);margin:24px auto 12px;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.notice{background:var(--accent-soft);color:#8a3a26;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.4;margin-bottom:12px}
/* toast */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translate(-50%,160%);z-index:40;background:#2b1d18;color:#fff;border-radius:16px;padding:12px 14px 12px 16px;display:flex;align-items:center;gap:12px;font-size:15px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:transform .25s ease,opacity .2s,visibility .25s;width:max-content;max-width:calc(100% - 28px);opacity:0;visibility:hidden;pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible;pointer-events:auto}
.toast button{color:var(--accent2);font-weight:800;padding:6px 8px;font-size:15px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="sheet" id="sheet"><div class="in">
  <div class="l" id="sheetLabel">Rest</div>
  <div class="t" id="sheetTime">0:00</div>
  <div class="bar"><i id="sheetBar"></i></div>
  <div class="btns"><button id="plus15">+15 sec</button><button class="skip" id="skipRest">Skip</button></div>
</div></div>

function buildSteps(d){

      var label = b.label;
      if(b.superset) label += " · Superset " + "AB"[i];

    html += '<div class="exlabel">Warm-up</div>' + (w.ex ? picHtml(w.ex, "pic") : '<div class="pic ph"><div class="e">🔥</div><div class="t">Get warm & loose</div></div>') +

      '<div class="exhead"><h2 class="exname">'+esc(exName(p))+'</h2>' + (SWAPS[st.base.ex] ? '<button class="swapbtn" id="swap">⇄ Swap</button>' : '') + '</div>' +

      (p.walkMins ? '' : '<div class="stat"><div class="v">'+b.rest+'s</div><div class="l">Rest</div></div>') + '</div>';
    html += '<p class="explain">'+esc(explainRx(p, fin))+'</p>';
    if(b.superset){
      var other = EX[effP(d.key, st.bi, 1-st.idx, b.items[1-st.idx]).ex].name;
      html += '<p class="note">'+(st.idx===0 ? '🔁 Superset: pair this with <b>'+esc(other)+'</b> (B). Do all sets here, or alternate A → B → rest.' : '🔁 Superset B — pairs with <b>'+esc(other)+'</b> (A).')+'</p>';
    } else if(fin && b.items.length>1 && !p.walkMins){

    }

    if(p.walkMins){
      html += '<button class="holdbtn" id="holdbtn" data-secs="'+(p.walkMins*60)+'">⏱ Start '+p.walkMins+'-min walk timer</button>';
    } else {
      if(showWeight(p)) html += weightHtml(p);
      html += '<div class="sets"><div class="h">'+(fin?'Tap each round when done':'Tap each set when done')+'</div><div class="dots">';
      for(var i=0;i<p.sets;i++) html += '<button class="dot'+(i<done?' on':'')+'" data-set="'+i+'">'+(i<done?'✓':(i+1))+'</button>';

  });

  if(hb) hb.onclick = function(){ unlockAudio(); if(hold) { stopHold(); resetHoldBtn(hb); } else startHold(hb); };

function toggleSet(i){
  var st = buildSteps(DAYS[state.day])[state.step]; var p = st.p;
  var cur = state.sets[state.step] || 0;
  var nowDone;
  if(i < cur){ state.sets[state.step] = i; nowDone = false; } else { state.sets[state.step] = i+1; nowDone = true; }
  updateDots(p);
  if(nowDone){
    var finishedAll = state.sets[state.step] >= p.sets;
    var lbl = finishedAll ? "Rest · then next exercise" : "Rest · set " + (state.sets[state.step]+1) + " next";
    if(st.block.finisher) lbl = finishedAll ? "Rest · then next move" : "Rest";
    startRest(st.block.rest, lbl);
  } else hideRest();
}
function updateDots(p){
  var done = state.sets[state.step] || 0;
  app.querySelectorAll("[data-set]").forEach(function(btn, i){ btn.classList.toggle("on", i<done); btn.textContent = i<done ? "✓" : (i+1); });
  var nx = document.getElementById("next"); if(nx) nx.classList.toggle("ready", done >= p.sets);
}

// ---- hold timer ----
function resetHoldBtn(hb){ hb.classList.remove("run"); var s = +hb.dataset.secs; hb.textContent = s>=60 ? "⏱ Restart "+(s/60)+"-min timer" : "⏱ Start "+s+"-sec hold"; }
function startHold(hb){
  hideRest();
  var secs = +hb.dataset.secs; var end = Date.now() + secs*1000;
  hb.classList.add("run");
  var tick = function(){
    var left = (end - Date.now())/1000;
    if(left <= 0){
      stopHold(); hb.classList.remove("run"); hb.textContent = "✓ Done! Tap to go again"; alertEnd();
      var st = buildSteps(DAYS[state.day])[state.step];
      if(st.type==="ex" && !st.p.walkMins){ var cur = state.sets[state.step]||0; if(cur < st.p.sets) toggleSet(cur); }
      return;
    }
    hb.textContent = "⏸ " + fmt(left) + " — tap to stop";
  };
  hold = setInterval(tick, 250); tick();
}
function stopHold(){ if(hold){ clearInterval(hold); hold = null; } }

// ---- rest timer ----
var sheet = document.getElementById("sheet");
function startRest(secs, label){
  if(rest) clearInterval(rest.iv);
  rest = {end: Date.now()+secs*1000, total: secs};
  document.getElementById("sheetLabel").textContent = label || "Rest";
  sheet.classList.add("show");
  var tick = function(){
    var left = (rest.end - Date.now())/1000;
    document.getElementById("sheetTime").textContent = fmt(left);
    document.getElementById("sheetBar").style.width = Math.max(0, Math.min(100, left/rest.total*100)) + "%";
    if(left <= 0){ alertEnd(); document.getElementById("sheetLabel").textContent = "Rest over — let’s go! 💪"; clearInterval(rest.iv); setTimeout(hideRest, 1800); }
  };
  rest.iv = setInterval(tick, 250); tick();
}
function hideRest(){ if(rest){ clearInterval(rest.iv); rest = null; } sheet.classList.remove("show"); }
document.getElementById("skipRest").onclick = hideRest;
document.getElementById("plus15").onclick = function(){ if(rest){ rest.end += 15000; rest.total += 15; } };

// ---- beep / vibrate / wake lock ----
var actx = null;
function unlockAudio(){
  try{ if(!actx){ var C = window.AudioContext || window.webkitAudioContext; if(C) actx = new C(); } if(actx && actx.state === "suspended") actx.resume(); }catch(e){}
}
function alertEnd(){
  try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
  try{
    if(!actx) return;
    [0, 0.25, 0.5].forEach(function(t, i){
      var o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = i===2 ? 1046 : 784; o.connect(g); g.connect(actx.destination);
      var s = actx.currentTime + t; g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.3, s+0.02); g.gain.exponentialRampToValueAtTime(0.0001, s+0.2);
      o.start(s); o.stop(s+0.22);
    });
  }catch(e){}
}
var wake = null;
function requestWake(){ try{ if(navigator.wakeLock && !wake) navigator.wakeLock.request("screen").then(function(w){ wake = w; w.addEventListener("release", function(){ wake = null; }); }).catch(function(){}); }catch(e){} }
document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="visible" && parseHash().step !== undefined) requestWake(); });

// ---- barcode helpers ----
function upcEtoA(c){
  if(!/^[01]\d{7}$/.test(c)) return null;
  var n = c[0], d = c.slice(1,7), x = c[7], l = d[5], a;
  if(l <= "2") a = n + d[0] + d[1] + l + "0000" + d[2] + d[3] + d[4];
  else if(l === "3") a = n + d[0] + d[1] + d[2] + "00000" + d[3] + d[4];
  else if(l === "4") a = n + d[0] + d[1] + d[2] + d[3] + "00000" + d[4];
  else a = n + d.slice(0,5) + "0000" + l;
  return a + x;
}
function codeVariants(c){
  var v = [c];
  if(c.length === 12) v.push("0" + c);
  if(c.length === 13 && c[0] === "0") v.push(c.slice(1));
  if(c.length === 8){ var a = upcEtoA(c); if(a) v.push(a, "0" + a); }
  return v.filter(function(x, i){ return v.indexOf(x) === i; });
}
function cacheCode(code, info){ var m = load("mw_codes", {}) || {}; m[code] = info; var ks = Object.keys(m); if(ks.length > 150) delete m[ks[0]]; save("mw_codes", m); }

function parseProduct(code, p){
  var n = p.nutriments || {};
  var name = String(p.product_name || "").trim(), brand = String(p.brands || "").split(",")[0].trim();
  var sq = num(p.serving_quantity);
  var kj2k = function(v){ return v === null ? null : v / 4.184; };
  var p100 = num(n.proteins_100g), k100 = num(n["energy-kcal_100g"]); if(k100 === null) k100 = kj2k(num(n.energy_100g));
  var pS = num(n.proteins_serving), kS = num(n["energy-kcal_serving"]); if(kS === null) kS = kj2k(num(n.energy_serving));
  if(sq > 0){ if(pS === null && p100 !== null) pS = p100 * sq / 100; if(kS === null && k100 !== null) kS = k100 * sq / 100; }
  var info = {code: code, name: name || "Unknown product", brand: brand, serving: String(p.serving_size || "").trim(), sq: sq};
  if(pS !== null || kS !== null){ info.mode = "serving"; info.pS = r1(pS || 0); info.kS = Math.round(kS || 0); }
  else if(p100 !== null || k100 !== null){ info.mode = "grams"; info.p100 = r1(p100 || 0); info.k100 = Math.round(k100 || 0); }
  else info.mode = "none";
  return info;
}
function fetchJSON(url, ms){
  var ctl = window.AbortController ? new AbortController() : null;
  var to = setTimeout(function(){ if(ctl) ctl.abort(); }, ms || 12000);
  return fetch(url, ctl ? {signal: ctl.signal} : {}).then(function(r){ clearTimeout(to); if(r.status === 404) return {status: 0}; if(!r.ok) throw new Error("http " + r.status); return r.json(); }, function(e){ clearTimeout(to); throw e; });
}
var lookupSeq = 0;
function lookup(code){
  var my = ++lookupSeq;
  openModal(mhead("Looking it up…") + '<div class="spin"></div><p class="camstat">Checking barcode '+esc(code)+'</p>');
  var cached = (load("mw_codes", {}) || {})[code];
  if(cached){ cached.code = code; return showProduct(cached); }
  var vars = codeVariants(code), netFail = false;
  var tryNext = function(i){
    if(my !== lookupSeq) return;
    if(i >= vars.length){
      if(netFail) return manualForm({title: "Couldn’t connect", code: code, msg: "📶 We couldn’t reach the food database. Check your internet and scan again, or type the numbers from the label below."});
      return manualForm({title: "Not found", code: code, msg: "🤔 We couldn’t find barcode <b>"+esc(code)+"</b>. Type it in from the label once and we’ll remember it next time."});
    }
    fetchJSON("https://world.openfoodfacts.org/api/v2/product/" + vars[i] + ".json?fields=product_name,brands,nutriments,serving_size,serving_quantity")
      .then(function(d){
        if(my !== lookupSeq) return;
        if(d && d.status === 1 && d.product){
          var info = parseProduct(code, d.product);
          if(info.mode === "none" && !String(d.product.product_name || "").trim()) return tryNext(i + 1);
          if(info.mode === "none") return manualForm({title: "Missing nutrition info", code: code, name: (info.brand ? info.brand + " " : "") + info.name, msg: "We found <b>"+esc(info.name)+"</b> but it has no protein or calorie info yet. Copy them from the label:"});
          cacheCode(code, info); return showProduct(info);
        }
        tryNext(i + 1);

  };
  tryNext(0);
}

function camFail(name){

var zxReady = null;
function loadZX(){
  if(zxReady) return zxReady;
  zxReady = new Promise(function(res, rej){
    try{
      if(!window.ZXing){ var s = document.createElement("script"); s.textContent = document.getElementById("zxsrc").textContent; document.head.appendChild(s); }
      if(window.ZXing && window.ZXing.MultiFormatReader) res(window.ZXing); else rej(new Error("zxing missing"));
    }catch(e){ rej(e); }
  });
  zxReady.catch(function(){ zxReady = null; });
  return zxReady;
}
var WANT = ["ean_13", "ean_8", "upc_a", "upc_e"];
function getDecoder(){
  var useNative = function(){
    if(!window.BarcodeDetector) return Promise.resolve(null);
    var gs = window.BarcodeDetector.getSupportedFormats ? window.BarcodeDetector.getSupportedFormats() : Promise.resolve(WANT);
    return gs.then(function(f){
      var fm = WANT.filter(function(x){ return f.indexOf(x) >= 0; });
      if(fm.indexOf("ean_13") < 0) return null;
      var det = new window.BarcodeDetector({formats: fm});
      return function(v){ return det.detect(v).then(function(r){ return r && r.length ? r[0].rawValue : null; }, function(){ return null; }); };
    }).catch(function(){ return null; });
  };
  return useNative().then(function(nat){
    if(nat) return nat;
    return loadZX().then(function(Z){
      var reader = new Z.MultiFormatReader(), hints = new Map();
      hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E]);
      hints.set(Z.DecodeHintType.TRY_HARDER, true);
      reader.setHints(hints);
      var cv = document.createElement("canvas"), ctx = cv.getContext("2d", {willReadFrequently: true}), flip = 0;
      return function(v){
        var vw = v.videoWidth || v.width, vh = v.videoHeight || v.height; if(!vw || !vh) return Promise.resolve(null);
        // middle band of the picture (where the box is), scaled down for speed
        var sy = Math.round(vh * 0.25), sh = Math.round(vh * 0.5), sc = Math.min(1, 960 / vw);
        cv.width = Math.round(vw * sc); cv.height = Math.round(sh * sc);
        ctx.drawImage(v, 0, sy, vw, sh, 0, 0, cv.width, cv.height);
        try{
          var src = new Z.HTMLCanvasElementLuminanceSource(cv);
          var bin = (flip++ % 2) ? new Z.GlobalHistogramBinarizer(src) : new Z.HybridBinarizer(src);
          var r = reader.decodeWithState(new Z.BinaryBitmap(bin));
          return Promise.resolve(r ? r.getText() : null);
        }catch(e){ return Promise.resolve(null); }
      };
    });
  });
}
window._mwDecoder = getDecoder; // used by tests
function startScan(){
  openModal(mhead("Scan barcode") + '<div class="cam"><video id="vid" playsinline webkit-playsinline muted autoplay></video><div class="frame"><i class="laser"></i></div></div>' +
    '<p class="camstat" id="camstat">Starting camera…</p><button class="cta ghost small" id="toType" style="width:100%">⌨️ Type the number instead</button>');
  $m("toType").onclick = function(){ typeCode(); };
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return camFail("nosupport");
  var my = scan = {stream: null, stop: false, timer: null, last: null, video: $m("vid")};
  navigator.mediaDevices.getUserMedia({audio: false, video: {facingMode: {ideal: "environment"}, width: {ideal: 1280}, height: {ideal: 720}}}).then(function(stream){
    if(my.stop || scan !== my){ stream.getTracks().forEach(function(t){ t.stop(); }); return; }
    my.stream = stream;
    var v = my.video; v.muted = true; v.setAttribute("playsinline", ""); v.srcObject = stream;
    var pp = v.play(); if(pp && pp.catch) pp.catch(function(){});
    var st = $m("camstat"); if(st) st.textContent = "Fit the barcode inside the box. Hold steady, about 6 inches away.";
    getDecoder().then(function(dec){
      if(my.stop) return;
      var tick = function(){
        if(my.stop) return;
        if(v.readyState >= 2 && v.videoWidth){
          dec(v).then(function(code){
            if(my.stop) return;
            if(code && /^\d{6,14}$/.test(code)){
              if(code === my.last){ try{ if(navigator.vibrate) navigator.vibrate(80); }catch(e){} stopScan(); lookup(code); return; }
              my.last = code;
            }
            my.timer = setTimeout(tick, 90);
          });
        } else my.timer = setTimeout(tick, 200);
      };
      tick();
    }).catch(function(){ if(scan === my) camFail("lib"); });
  }).catch(function(err){ if(scan === my) camFail(err && err.name); });
}

  openModal(html);
  modal.querySelectorAll("[data-vid]").forEach(function(a){ a.addEventListener("click", function(e){ e.stopPropagation(); }); });
  modal.querySelectorAll("[data-pick]").forEach(function(el){ el.onclick = function(){
    var k = el.dataset.pick, sw = load("mw_swaps", {}) || {}, key = swapKey(dk, bi, ii);
    if(k === orig) delete sw[key]; else sw[key] = k;
    save("mw_swaps", sw); closeModal(); rerender();
    toast(k === orig ? "Back to " + EX[k].name : "Swapped to " + EX[k].name);
  }; });
}

// =================== LIFT WEIGHT LOG ===================
function showWeight(p){ var e = EX[p.ex]; return !!e && !p.walkMins && !e.bw && (!p.hold || !!e.carry); }
function lifts(ex){ var m = load("mw_lifts", {}) || {}; return Array.isArray(m[ex]) ? m[ex] : []; }
function lastLift(ex, beforeToday){ var l = lifts(ex), t = ymd(); for(var i = l.length - 1; i >= 0; i--){ if(!beforeToday || l[i].d < t) return l[i]; } return null; }
function repsLabel(p){ return p.hold ? p.hold + " sec" : p.reps + (p.each ? "/" + p.each : ""); }
function niceDate(d){ var a = d.split("-"); return new Date(+a[0], +a[1]-1, +a[2]).toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"}); }
function saveLift(p, w){
  var m = load("mw_lifts", {}) || {}, l = Array.isArray(m[p.ex]) ? m[p.ex] : [], t = ymd();
  l = l.filter(function(x){ return x.d !== t; });
  if(w > 0) l.push({d: t, w: Math.round(w*10)/10, r: repsLabel(p)});
  m[p.ex] = l.slice(-40); save("mw_lifts", m);
}
function weightHtml(p){
  var today = lifts(p.ex).filter(function(x){ return x.d === ymd(); })[0], prev = lastLift(p.ex, true);
  var val = today ? today.w : (prev ? prev.w : "");
  return '<div class="wcard"><div class="h"><span>Weight used (lbs)</span><span class="ok" id="wOk">'+(today ? 'Saved ✓' : '')+'</span></div>' +
    '<div class="wrow"><button class="wbtn" data-wstep="-5" aria-label="Minus 5">−5</button><label class="win"><input id="wIn" type="number" inputmode="decimal" min="0" step="any" placeholder="0" value="'+val+'"><span>lbs</span></label><button class="wbtn" data-wstep="5" aria-label="Plus 5">+5</button></div>' +
    '<div class="wlast">'+(prev ? 'Last time: <b>'+prev.w+' lbs × '+esc(prev.r)+'</b> · '+esc(niceDate(prev.d)) : 'First time: pick a weight you can lift with 1–2 reps left.')+'</div></div>';
}
function commitWeight(p){
  var inp = document.getElementById("wIn"); if(!inp || !showWeight(p)) return;
  var w = num(inp.value); saveLift(p, w || 0);
  var ok = document.getElementById("wOk"); if(ok) ok.textContent = w > 0 ? "Saved ✓" : "";
}
function bindWeight(p){
  var inp = document.getElementById("wIn"); if(!inp) return;
  app.querySelectorAll("[data-wstep]").forEach(function(b){ b.onclick = function(){
    var w = Math.max(0, (num(inp.value) || 0) + (+b.dataset.wstep)); inp.value = Math.round(w*10)/10; commitWeight(p);
  }; });
  inp.addEventListener("change", function(){ commitWeight(p); });
  inp.addEventListener("blur", function(){ commitWeight(p); });
}

// =================== BODY WEIGHT ===================
function bwList(){
  var l = load("mw_bw", null);
  if(!Array.isArray(l)){ l = [{d:"2026-10-05", w:116}]; save("mw_bw", l); }
  return l.filter(function(x){ return x && x.d && +x.w > 0; }).sort(function(a, b){ return a.d < b.d ? -1 : a.d > b.d ? 1 : 0; });
}
function fmtLbs(x){ return (Math.round(x*10)/10) + ""; }
function chg(x){ x = Math.round(x*10)/10; return (x > 0 ? "+" : x < 0 ? "−" : "±") + Math.abs(x) + " lbs"; }
function spark(l, w, h, big){
  if(l.length < 2) return '<svg viewBox="0 0 '+w+' '+h+'" aria-hidden="true"><line x1="4" y1="'+(h/2)+'" x2="'+(w-4)+'" y2="'+(h/2)+'" stroke="#f1e2d9" stroke-width="3" stroke-linecap="round"/>'+(l.length ? '<circle cx="'+(w/2)+'" cy="'+(h/2)+'" r="'+(big?5:4)+'" fill="#e8664a"/>' : '')+'</svg>';
  var ts = l.map(function(x){ var a = x.d.split("-"); return new Date(+a[0], +a[1]-1, +a[2]).getTime(); });
  var t0 = ts[0], t1 = ts[ts.length-1], ws = l.map(function(x){ return +x.w; });
  var lo = Math.min.apply(null, ws) - 1, hi = Math.max.apply(null, ws) + 1, pad = big ? 14 : 5;
  var padL = big ? 44 : pad;
  var pts = l.map(function(x, i){ var X = padL + (t1 > t0 ? (ts[i]-t0)/(t1-t0) : i/(l.length-1)) * (w - padL - pad); var Y = pad + (hi - ws[i]) / (hi - lo) * (h - 2*pad); return [Math.round(X*10)/10, Math.round(Y*10)/10]; });
  var path = pts.map(function(q, i){ return (i ? "L" : "M") + q[0] + " " + q[1]; }).join(" ");
  var dots = big ? pts.map(function(q){ return '<circle cx="'+q[0]+'" cy="'+q[1]+'" r="4" fill="#e8664a"/>'; }).join("") : '<circle cx="'+pts[pts.length-1][0]+'" cy="'+pts[pts.length-1][1]+'" r="4" fill="#e8664a"/>';
  var mx = Math.max.apply(null, ws), mn = Math.min.apply(null, ws), yOf = function(v){ return Math.round((pad + (hi - v) / (hi - lo) * (h - 2*pad))*10)/10; };
  var ylab = big ? '<line x1="'+padL+'" x2="'+(w-pad)+'" y1="'+yOf(mx)+'" y2="'+yOf(mx)+'" stroke="#f1e2d9" stroke-dasharray="3 4"/><text x="2" y="'+(yOf(mx)+4)+'" font-size="11" font-weight="700" fill="#8a7068">'+fmtLbs(mx)+'</text>' +
    (mn < mx ? '<line x1="'+padL+'" x2="'+(w-pad)+'" y1="'+yOf(mn)+'" y2="'+yOf(mn)+'" stroke="#f1e2d9" stroke-dasharray="3 4"/><text x="2" y="'+(yOf(mn)+4)+'" font-size="11" font-weight="700" fill="#8a7068">'+fmtLbs(mn)+'</text>' : '') : '';
  var labels = ylab + (big ? '<text x="'+padL+'" y="'+(h-2)+'" font-size="11" fill="#8a7068">'+esc(niceDate(l[0].d))+'</text><text x="'+(w-pad)+'" y="'+(h-2)+'" font-size="11" fill="#8a7068" text-anchor="end">'+esc(niceDate(l[l.length-1].d))+'</text>' : '');
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true">'+labels+'<path d="'+path+'" fill="none" stroke="#f29a5c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'+dots+'</svg>';
}
function bodyCardHtml(){
  var l = bwList();
  if(!l.length) return '<button class="bodyw" id="bodyw"><div class="bm"><div class="bl">My weight</div><div class="bd">Tap to log your weight</div></div><span class="blog">＋ Log</span></button>';
  var last = l[l.length-1], first = l[0];
  return '<button class="bodyw" id="bodyw"><div class="bm"><div class="bl">My weight</div><div class="bv">'+fmtLbs(last.w)+' <small>lbs</small></div>' +
    '<div class="bd">'+(l.length > 1 ? chg(last.w - first.w)+' since '+esc(niceDate(first.d).replace(/^\w+, /, "")) : 'Starting weight · '+esc(niceDate(first.d).replace(/^\w+, /, "")))+'</div></div>' +
    spark(l, 96, 44, false) + '<span class="blog">＋ Log</span></button>';
}
function openBodyWeight(){
  var l = bwList(), t = ymd(), today = l.filter(function(x){ return x.d === t; })[0], last = l[l.length-1];
  var val = today ? today.w : (last ? last.w : "");
  var html = mhead("My weight") +
    '<div class="wcard"><div class="h"><span>Today’s weight (lbs)</span><span class="ok">'+(today ? 'Logged today ✓' : '')+'</span></div>' +
    '<div class="wrow"><button class="wbtn" data-bstep="-0.5">−½</button><label class="win"><input id="bwIn" type="number" inputmode="decimal" min="50" max="400" step="any" value="'+val+'"><span>lbs</span></label><button class="wbtn" data-bstep="0.5">+½</button></div>' +
    '<button class="cta" id="bwSave" style="margin-top:12px">'+(today ? 'Update today' : 'Save today’s weight')+'</button></div>' +
    '<div class="notice">⚖️ Weight can swing 2–4 lbs day to day (water, salt, sleep, cycle). Weigh in the morning before eating and watch the trend, not one day. Building muscle while getting leaner can keep the scale steady even while you change shape.</div>';
  if(l.length) html += '<div class="chart">'+spark(l, 340, 150, true)+'</div>';
  html += '<div class="section" style="padding-bottom:8px"><div class="h"><b>History</b><span>'+l.length+' entr'+(l.length === 1 ? 'y' : 'ies')+'</span></div>';
  if(!l.length) html += '<div class="empty">No entries yet.</div>';
  l.slice().reverse().forEach(function(x, i, arr){
    var prev = arr[i+1];
    html += '<div class="bwrow"><div class="bwd">'+esc(niceDate(x.d))+'</div><div class="bww">'+fmtLbs(x.w)+' lbs</div><div class="bwc">'+(prev ? chg(x.w - prev.w) : 'start')+'</div><button class="del" data-bwdel="'+x.d+'" aria-label="Delete">✕</button></div>';
  });
  html += '</div>';
  openModal(html);
  var inp = $m("bwIn");
  modal.querySelectorAll("[data-bstep]").forEach(function(b){ b.onclick = function(){ inp.value = Math.round(((num(inp.value) || 0) + (+b.dataset.bstep))*10)/10; }; });
  $m("bwSave").onclick = function(){
    var w = num(inp.value); if(!(w >= 50 && w <= 400)){ inp.closest(".win").style.borderColor = "var(--accent)"; return; }
    var cur = bwList().filter(function(x){ return x.d !== t; }); cur.push({d: t, w: Math.round(w*10)/10}); save("mw_bw", cur);
    refreshAfterBody(); toast("Saved " + fmtLbs(w) + " lbs");
  };
  modal.querySelectorAll("[data-bwdel]").forEach(function(b){ b.onclick = function(){
    var d = b.dataset.bwdel, all = bwList(), gone = all.filter(function(x){ return x.d === d; })[0];
    save("mw_bw", all.filter(function(x){ return x.d !== d; })); refreshAfterBody();
    if(gone) toast("Deleted " + fmtLbs(gone.w) + " lbs", "Undo", function(){ var c = bwList(); c.push(gone); save("mw_bw", c); refreshAfterBody(); });
  }; });
}
function refreshAfterBody(){
  var y = window.scrollY; closeModal();
  if(!location.hash || location.hash === "#"){ renderHome(); window.scrollTo(0, y); }
  openBodyWeight();
}

render();
</script>
