<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mina's Workouts">
<meta name="theme-color" content="#fff7f1">
<title>Mina's Workouts</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23e8664a'/%3E%3Ctext x='90' y='118' font-size='90' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EM%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#fff7f1; --card:#ffffff; --ink:#2b1d18; --muted:#8a7068; --line:#f1e2d9;
  --accent:#e8664a; --accent2:#f29a5c; --accent-soft:#fde6dc; --good:#3fa66b; --good-soft:#e2f4e8;
  --radius:22px; --shadow:0 6px 20px rgba(120,60,30,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 24px)}
h1{font-size:30px;line-height:1.1;margin:6px 0 4px;letter-spacing:-.5px}
h2{font-size:22px;margin:0;letter-spacing:-.3px}
.sub{color:var(--muted);font-size:15px;margin:0}
.tip{display:flex;gap:8px;align-items:center;background:var(--accent-soft);color:#a8432b;border-radius:14px;padding:10px 14px;font-size:14px;font-weight:600;margin:14px 0}
.cards{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.daycard{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border:2px solid transparent;transition:transform .1s}
.daycard:active{transform:scale(.98)}
.daycard.today{border-color:var(--accent);background:linear-gradient(135deg,#fff 0%,#fff1ea 100%)}
.dayicon{flex:0 0 56px;height:56px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.daycard.done .dayicon{background:var(--good)}
.daymeta{flex:1;min-width:0}
.dayname{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;display:flex;gap:8px;align-items:center}
.daytitle{font-size:19px;font-weight:700;margin-top:2px}
.daytime{font-size:14px;color:var(--muted);margin-top:2px}
.badge{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--accent);color:#fff;letter-spacing:.4px}
.badge.good{background:var(--good)}
.chev{color:#cdb5ab;font-size:26px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;min-height:44px}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:20px}
.hero{border-radius:var(--radius);padding:22px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:var(--shadow);margin-bottom:14px}
.hero .k{opacity:.9;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.hero h1{color:#fff}
.hero .pills{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.22);padding:6px 11px;border-radius:99px;font-size:13px;font-weight:600}
.section{background:var(--card);border-radius:var(--radius);padding:16px 16px 6px;box-shadow:var(--shadow);margin-bottom:12px}
.section .h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.section .h b{font-size:16px}
.section .h span{font-size:13px;color:var(--muted);font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.thumb{flex:0 0 64px;height:42px;border-radius:10px;background:#f6ece6 center/cover no-repeat;display:grid;place-items:center;font-size:20px}
.row .n{font-weight:600;font-size:15px}
.row .d{font-size:13px;color:var(--muted)}
.ss{display:inline-block;font-size:10px;font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 6px;margin-right:6px;vertical-align:1px}
.cta{display:block;width:100%;padding:18px;border-radius:18px;background:var(--accent);color:#fff;font-size:18px;font-weight:700;box-shadow:0 8px 20px rgba(232,102,74,.35);text-align:center}
.cta:active{transform:scale(.98)}
.cta.ghost{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.sticky{position:sticky;bottom:calc(env(safe-area-inset-bottom) + 12px);margin-top:16px}
/* goals */
.goals{background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);margin-bottom:12px}
.goals .h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.goals .h b{font-size:15px}.goals .h span{font-size:12px;color:var(--muted);font-weight:600}
.goal{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 0;font-size:14px;line-height:1.3}
.goal .box{flex:0 0 26px;height:26px;border-radius:8px;border:2px solid #e3cfc5;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:800;transition:all .15s}
.goal.on .box{background:var(--good);border-color:var(--good)}
.goal.on .gt{color:var(--muted);text-decoration:line-through}
.meal{display:block;font-size:11px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.6px;margin-bottom:1px}
.goal.on .meal{color:var(--muted)}
.foodnote{font-size:13px;color:var(--ink);background:var(--bg);border-radius:12px;padding:9px 12px;margin-top:8px}
.foodnote.small{font-size:12px;color:var(--muted)}
/* workout */
.progress{height:8px;background:#f3e3da;border-radius:99px;overflow:hidden;flex:1;margin:0 12px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .3s}
.stepcount{font-size:13px;color:var(--muted);font-weight:700;min-width:44px;text-align:right}
.exlabel{font-size:13px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.6px;margin:12px 0 4px}
.pic{width:100%;aspect-ratio:16/9;border-radius:var(--radius);background:#f6ece6 center/cover no-repeat;box-shadow:var(--shadow);margin:8px 0 14px;overflow:hidden}
.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:linear-gradient(135deg,#fde6dc,#fff1e6);color:#c2583f}
.ph .e{font-size:54px;line-height:1}
.ph .t{font-size:13px;font-weight:700;opacity:.8}
.exname{font-size:28px;font-weight:800;letter-spacing:-.5px;margin:0}
.sr{display:flex;gap:10px;margin:12px 0}
.stat{flex:1;background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.stat .v{font-size:22px;font-weight:800}
.stat .l{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.explain{font-size:15px;color:var(--muted);margin:0 0 12px}
.note{font-size:14px;background:#fff;border-left:4px solid var(--accent2);border-radius:10px;padding:10px 12px;margin:0 0 12px;box-shadow:var(--shadow)}
.vid{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:16px;background:#2b1d18;color:#fff;font-weight:700;font-size:16px;text-decoration:none;margin-bottom:14px}
.sets{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.sets .h{font-size:14px;font-weight:700;color:var(--muted);margin-bottom:12px}
.dots{display:flex;gap:12px;flex-wrap:wrap}
.dot{width:58px;height:58px;border-radius:50%;border:3px solid #ecd6cb;display:grid;place-items:center;font-weight:800;font-size:18px;color:var(--muted);background:#fff;transition:all .15s}
.dot.on{background:var(--good);border-color:var(--good);color:#fff}
.holdbtn{width:100%;padding:14px;border-radius:16px;background:var(--accent-soft);color:#a8432b;font-weight:800;font-size:17px;margin-top:14px}
.holdbtn.run{background:var(--accent);color:#fff}
.nav{display:flex;gap:10px;margin-top:16px;position:sticky;bottom:calc(env(safe-area-inset-bottom) + 10px)}
.nav button{flex:1;padding:17px;border-radius:18px;font-weight:700;font-size:17px}
.nav .back{flex:0 0 32%;background:var(--card);box-shadow:var(--shadow)}
.nav .next{background:var(--accent);color:#fff;box-shadow:0 8px 20px rgba(232,102,74,.35)}
.nav .next.ready{background:var(--good);box-shadow:0 8px 20px rgba(63,166,107,.35)}
/* rest sheet */
.sheet{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 86px);z-index:20;transform:translateY(calc(100% + 120px));opacity:0;transition:transform .28s ease,opacity .2s;padding:0 12px;pointer-events:none}
.sheet.show{transform:none;opacity:1;pointer-events:auto}
.sheet .in{max-width:500px;margin:0 auto;background:#2b1d18;color:#fff;border-radius:24px;padding:16px 18px;box-shadow:0 -6px 30px rgba(0,0,0,.25);text-align:center}
.sheet .l{font-size:13px;font-weight:700;opacity:.7;text-transform:uppercase;letter-spacing:.8px}
.sheet .t{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px;margin:4px 0}
.sheet .bar{height:6px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden;margin-bottom:14px}
.sheet .bar i{display:block;height:100%;background:var(--accent2)}
.sheet .btns{display:flex;gap:10px}
.sheet .btns button{flex:1;padding:14px;border-radius:14px;background:rgba(255,255,255,.12);font-weight:700;font-size:16px;color:#fff}
.sheet .btns .skip{background:var(--accent)}
/* finish */
.finish{text-align:center;padding-top:30px}
.trophy{font-size:84px;animation:pop .6s ease}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.weekstrip{display:flex;gap:6px;justify-content:center;margin:18px 0}
.weekstrip span{width:44px;height:44px;border-radius:12px;background:#f3e3da;display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--muted)}
.weekstrip span.on{background:var(--good);color:#fff}
.footer{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="sheet" id="sheet"><div class="in">
  <div class="l" id="sheetLabel">Rest</div>
  <div class="t" id="sheetTime">0:00</div>
  <div class="bar"><i id="sheetBar"></i></div>
  <div class="btns"><button id="plus15">+15 sec</button><button class="skip" id="skipRest">Skip</button></div>
</div></div>

// ---- storage (safe) ----
var mem = {};
function load(k, d){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return mem[k] !== undefined ? mem[k] : d; } }
function save(k, v){ mem[k] = v; try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function ymd(d){ d = d || new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function weekStart(d){ d = new Date(d || new Date()); d.setHours(0,0,0,0); var w = (d.getDay()+6)%7; d.setDate(d.getDate()-w); return d; }
function doneThisWeek(key){
  var log = load("mw_done", []); var ws = weekStart().getTime(); var we = ws + 7*864e5;
  return log.some(function(r){ if(r.day !== key) return false; var p = r.date.split("-"); var t = new Date(+p[0], +p[1]-1, +p[2]).getTime(); return t >= ws && t < we; });
}
function markDone(key){ var log = load("mw_done", []); var today = ymd(); if(!log.some(function(r){return r.day===key && r.date===today;})) log.push({day:key, date:today}); save("mw_done", log.slice(-200)); }
function todayIdx(){ var g = new Date().getDay(); return (g>=1 && g<=5) ? g-1 : -1; }

// ---- helpers ----
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function fmt(s){ s = Math.max(0, Math.ceil(s)); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }
function exName(p){ var n = EX[p.ex].name; if(p.variant==="hold") n += " hold"; if(p.variant==="pulses") n += " pulses"; return n; }
function shortRx(p, fin){
  if(p.walkMins) return p.walkText;
  var unit = fin ? " rounds" : "";
  var right = p.hold ? p.hold + " sec" : (p.reps + (p.each ? "/" + p.each : ""));
  return fin ? p.sets + " rounds × " + right : p.sets + "×" + right;
}
function explainRx(p, fin){
  if(p.walkMins) return "Easy pace for " + p.walkText + ". No sets — just breathe and cool down.";
  var setW = fin ? (p.sets===1?"round":"rounds") : (p.sets===1?"set":"sets");
  if(p.hold){ var w = p.holdWord || "hold"; return p.sets + " " + setW + " of a " + p.hold + "-second " + w + "."; }
  return p.sets + " " + setW + " of " + p.reps + " reps" + (p.each ? " on each " + p.each : "") + ".";
}
function picHtml(ex, cls){
  var e = EX[ex];
  if(e.pic && IMG[e.pic]) return '<div class="'+cls+'" style="background-image:url('+IMG[e.pic]+')" role="img" aria-label="'+esc(e.name)+'"></div>';
  return '<div class="'+cls+' ph"><div class="e">'+e.icon+'</div>' + (cls==="pic" && e.video ? '<div class="t">Tap “Watch form video” for a demo</div>' : '') + '</div>';
}

// ---- steps ----
function buildSteps(d){
  var steps = [{type:"warmup", w:d.warmup}];
  d.blocks.forEach(function(b){
    b.items.forEach(function(p, i){
      var label = b.label;
      if(b.superset) label += " · Superset " + "AB"[i];
      else if(b.finisher) label += " · " + (i+1) + " of " + b.items.length;
      steps.push({type:"ex", p:p, block:b, idx:i, label:label});
    });
  });
  return steps;
}

// ---- state & router ----
var app = document.getElementById("app");
var state = {view:"home", day:0, step:0, sets:{}};
var hold = null;   // running hold timer
var rest = null;   // running rest timer

function go(hash){ if(location.hash === hash) render(); else location.hash = hash; }
function parseHash(){
  var h = location.hash.replace(/^#/, ""); var q = {};
  h.split("&").forEach(function(kv){ if(!kv) return; var a = kv.split("="); q[a[0]] = a[1]; });
  return q;
}
window.addEventListener("hashchange", render);

function render(){
  stopHold(); hideRest(); window.scrollTo(0,0);
  document.querySelectorAll(".confetti").forEach(function(c){ c.remove(); });
  var q = parseHash();
  var di = DAYS.findIndex(function(d){ return d.key === q.day; });
  if(di < 0){ hideRest(); return renderHome(); }
  if(state.day !== di){ state.sets = {}; }
  state.day = di;
  if(q.done){ hideRest(); return renderFinish(); }
  if(q.step !== undefined){
    var s = Math.max(0, Math.min(buildSteps(DAYS[di]).length-1, parseInt(q.step,10)||0));
    state.step = s; return renderStep();
  }
  hideRest(); renderOverview();
}

  return '<div class="goals"><div class="h"><b>Daily goals</b><span>'+n+'/'+GOALS.length+' today</span></div>' +
    GOALS.map(function(x){ return '<button class="goal'+(g[x.k]?' on':'')+'" data-goal="'+x.k+'"><span class="box">'+(g[x.k]?'✓':'')+'</span><span class="gt">'+esc(x.t)+'</span></button>'; }).join("") + '</div>';
}
function bindGoals(){
  app.querySelectorAll("[data-goal]").forEach(function(b){
    b.onclick = function(){
      var key = "mw_goals_" + ymd(); var g = load(key, {}); g[b.dataset.goal] = !g[b.dataset.goal]; save(key, g);
      var card = b.closest(".goals"); var tmp = document.createElement("div"); tmp.innerHTML = goalsHtml();
      card.replaceWith(tmp.firstChild); bindGoals();

// ---- STEP ----
function renderStep(){
  var d = DAYS[state.day]; var steps = buildSteps(d); var st = steps[state.step];
  var pct = Math.round((state.step) / steps.length * 100);
  var html = '<div class="topbar"><button class="iconbtn" id="close" aria-label="Exit">✕</button>' +
    '<div class="progress"><i style="width:'+pct+'%"></i></div><div class="stepcount">'+(state.step+1)+'/'+steps.length+'</div></div>' +
    '<div class="tip" style="margin:8px 0 0">💡 Leave 1–2 reps in the tank.</div>';
  var isLast = state.step === steps.length - 1;
  if(st.type === "warmup"){
    var w = st.w;
    html += '<div class="exlabel">Warm-up</div>' + (w.ex ? picHtml(w.ex, "pic") : '<div class="pic ph"><div class="e">🔥</div><div class="t">Get warm & loose</div></div>') +
      '<h2 class="exname">'+(w.ex?EX[w.ex].name:'Warm-up')+'</h2><p class="explain" style="margin-top:8px">'+esc(w.text)+'</p>';
    if(w.ex) html += '<p class="note">'+esc(EX[w.ex].cue)+'</p><a class="vid" href="'+EX[w.ex].video+'" target="_blank" rel="noopener">▶ Watch form video</a>';
    if(w.mins) html += '<button class="holdbtn" id="holdbtn" data-secs="'+(w.mins*60)+'">⏱ Start '+w.mins+'-min timer</button>';
  } else {
    var p = st.p, b = st.block, e = EX[p.ex], fin = !!b.finisher;
    var key = state.step; var done = state.sets[key] || 0;
    html += '<div class="exlabel">'+esc(st.label)+'</div>' + picHtml(p.ex, "pic") + '<h2 class="exname">'+esc(exName(p))+'</h2>';
    var main = p.walkMins ? p.walkText : (p.hold ? p.hold + " sec" : p.reps + (p.each ? "/" + p.each : ""));
    html += '<div class="sr">' + (p.walkMins ? '' : '<div class="stat"><div class="v">'+p.sets+'</div><div class="l">'+(fin?'Rounds':'Sets')+'</div></div>') +
      '<div class="stat"><div class="v">'+esc(main)+'</div><div class="l">'+(p.walkMins?'Time':p.hold?'Hold':'Reps')+'</div></div>' +
      (p.walkMins ? '' : '<div class="stat"><div class="v">'+b.rest+'s</div><div class="l">Rest</div></div>') + '</div>';
    html += '<p class="explain">'+esc(explainRx(p, fin))+'</p>';
    if(b.superset){
      var other = EX[b.items[1-st.idx].ex].name;
      html += '<p class="note">'+(st.idx===0 ? '🔁 Superset: pair this with <b>'+esc(other)+'</b> (B). Do all sets here, or alternate A → B → rest.' : '🔁 Superset B — pairs with <b>'+esc(other)+'</b> (A).')+'</p>';
    } else if(fin && b.items.length>1 && !p.walkMins){
      html += '<p class="note">🔥 Finisher: do every move once, that’s 1 round. Rest ~'+b.rest+'s between rounds.</p>';
    }
    html += '<p class="note">'+esc(e.cue)+'</p>';
    if(e.video) html += '<a class="vid" href="'+e.video+'" target="_blank" rel="noopener">▶ Watch form video</a>';
    if(p.walkMins){
      html += '<button class="holdbtn" id="holdbtn" data-secs="'+(p.walkMins*60)+'">⏱ Start '+p.walkMins+'-min walk timer</button>';
    } else {
      html += '<div class="sets"><div class="h">'+(fin?'Tap each round when done':'Tap each set when done')+'</div><div class="dots">';
      for(var i=0;i<p.sets;i++) html += '<button class="dot'+(i<done?' on':'')+'" data-set="'+i+'">'+(i<done?'✓':(i+1))+'</button>';
      html += '</div>' + (p.hold ? '<button class="holdbtn" id="holdbtn" data-secs="'+p.hold+'">⏱ Start '+p.hold+'-sec '+(p.holdWord||'hold')+'</button>' : '') + '</div>';
    }
  }
  var allDone = st.type==="ex" && !st.p.walkMins && (state.sets[state.step]||0) >= st.p.sets;
  html += '<div class="nav"><button class="back" id="back">‹ Back</button><button class="next'+(allDone?' ready':'')+'" id="next">'+(isLast?'Finish ✓':'Next ›')+'</button></div>';
  app.innerHTML = html;

  document.getElementById("close").onclick = function(){ if(confirm("End this workout? Progress won’t be saved.")){ hideRest(); go("#day="+d.key); } };
  document.getElementById("back").onclick = function(){ hideRest(); if(state.step===0) go("#day="+d.key); else go("#day="+d.key+"&step="+(state.step-1)); };
  document.getElementById("next").onclick = function(){ hideRest(); if(isLast) go("#day="+d.key+"&done=1"); else go("#day="+d.key+"&step="+(state.step+1)); };
  app.querySelectorAll("[data-set]").forEach(function(btn){
    btn.onclick = function(){ unlockAudio(); toggleSet(+btn.dataset.set); };
  });
  var hb = document.getElementById("holdbtn");
  if(hb) hb.onclick = function(){ unlockAudio(); if(hold) { stopHold(); resetHoldBtn(hb); } else startHold(hb); };
}

function toggleSet(i){
  var st = buildSteps(DAYS[state.day])[state.step]; var p = st.p;
  var cur = state.sets[state.step] || 0;
  var nowDone;
  if(i < cur){ state.sets[state.step] = i; nowDone = false; } else { state.sets[state.step] = i+1; nowDone = true; }
  updateDots(p);
  if(nowDone){
    var finishedAll = state.sets[state.step] >= p.sets;
    var lbl = finishedAll ? "Rest · then next exercise" : "Rest · set " + (state.sets[state.step]+1) + " next";
    if(st.block.finisher) lbl = finishedAll ? "Rest · then next move" : "Rest";
    startRest(st.block.rest, lbl);
  } else hideRest();
}
function updateDots(p){
  var done = state.sets[state.step] || 0;
  app.querySelectorAll("[data-set]").forEach(function(btn, i){ btn.classList.toggle("on", i<done); btn.textContent = i<done ? "✓" : (i+1); });
  var nx = document.getElementById("next"); if(nx) nx.classList.toggle("ready", done >= p.sets);
}

// ---- hold timer ----
function resetHoldBtn(hb){ hb.classList.remove("run"); var s = +hb.dataset.secs; hb.textContent = s>=60 ? "⏱ Restart "+(s/60)+"-min timer" : "⏱ Start "+s+"-sec hold"; }
function startHold(hb){
  hideRest();
  var secs = +hb.dataset.secs; var end = Date.now() + secs*1000;
  hb.classList.add("run");
  var tick = function(){
    var left = (end - Date.now())/1000;
    if(left <= 0){
      stopHold(); hb.classList.remove("run"); hb.textContent = "✓ Done! Tap to go again"; alertEnd();
      var st = buildSteps(DAYS[state.day])[state.step];
      if(st.type==="ex" && !st.p.walkMins){ var cur = state.sets[state.step]||0; if(cur < st.p.sets) toggleSet(cur); }
      return;
    }
    hb.textContent = "⏸ " + fmt(left) + " — tap to stop";
  };
  hold = setInterval(tick, 250); tick();
}
function stopHold(){ if(hold){ clearInterval(hold); hold = null; } }

// ---- rest timer ----
var sheet = document.getElementById("sheet");
function startRest(secs, label){
  if(rest) clearInterval(rest.iv);
  rest = {end: Date.now()+secs*1000, total: secs};
  document.getElementById("sheetLabel").textContent = label || "Rest";
  sheet.classList.add("show");
  var tick = function(){
    var left = (rest.end - Date.now())/1000;
    document.getElementById("sheetTime").textContent = fmt(left);
    document.getElementById("sheetBar").style.width = Math.max(0, Math.min(100, left/rest.total*100)) + "%";
    if(left <= 0){ alertEnd(); document.getElementById("sheetLabel").textContent = "Rest over — let’s go! 💪"; clearInterval(rest.iv); setTimeout(hideRest, 1800); }
  };
  rest.iv = setInterval(tick, 250); tick();
}
function hideRest(){ if(rest){ clearInterval(rest.iv); rest = null; } sheet.classList.remove("show"); }
document.getElementById("skipRest").onclick = hideRest;
document.getElementById("plus15").onclick = function(){ if(rest){ rest.end += 15000; rest.total += 15; } };

// ---- beep / vibrate / wake lock ----
var actx = null;
function unlockAudio(){
  try{ if(!actx){ var C = window.AudioContext || window.webkitAudioContext; if(C) actx = new C(); } if(actx && actx.state === "suspended") actx.resume(); }catch(e){}
}
function alertEnd(){
  try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
  try{
    if(!actx) return;
    [0, 0.25, 0.5].forEach(function(t, i){
      var o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = i===2 ? 1046 : 784; o.connect(g); g.connect(actx.destination);
      var s = actx.currentTime + t; g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.3, s+0.02); g.gain.exponentialRampToValueAtTime(0.0001, s+0.2);
      o.start(s); o.stop(s+0.22);
    });
  }catch(e){}
}
var wake = null;
function requestWake(){ try{ if(navigator.wakeLock && !wake) navigator.wakeLock.request("screen").then(function(w){ wake = w; w.addEventListener("release", function(){ wake = null; }); }).catch(function(){}); }catch(e){} }
document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="visible" && parseHash().step !== undefined) requestWake(); });

// ---- FINISH ----
function renderFinish(){
  var d = DAYS[state.day]; markDone(d.key);
  try{ if(wake){ wake.release(); wake = null; } }catch(e){}
  var strip = DAYS.map(function(x){ return '<span class="'+(doneThisWeek(x.key)?'on':'')+'">'+(doneThisWeek(x.key)?'✓':x.short)+'</span>'; }).join("");
  var n = DAYS.filter(function(x){ return doneThisWeek(x.key); }).length;
  var html = '<div class="finish"><div class="trophy">🏆</div><h1>Workout complete!</h1><p class="sub">'+d.day+' · '+d.title+'</p>' +
    '<div class="weekstrip">'+strip+'</div><p class="sub" style="margin-bottom:18px">'+n+' of 5 this week — so proud of you, Mina 💛</p></div>' +
    goalsHtml() + '<div style="margin-top:14px"><button class="cta" id="home">Back to my week</button></div>';
  app.innerHTML = html;
  document.getElementById("home").onclick = function(){ go("#"); };
  bindGoals();
  var c = document.createElement("div"); c.className = "confetti";
  var cols = ["#e8664a","#f29a5c","#3fa66b","#ffd166","#f7b2a0"];
  for(var i=0;i<60;i++){ var p = document.createElement("i"); p.style.left = Math.random()*100+"%"; p.style.background = cols[i%cols.length]; p.style.animationDuration = (2+Math.random()*2.5)+"s"; p.style.animationDelay = (Math.random()*0.8)+"s"; c.appendChild(p); }
  document.body.appendChild(c); setTimeout(function(){ c.remove(); }, 5000);
}

render();
</script>
